{% extends 'ytdownloader/base.html' %}
{% block title %}Novo Download{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center">
    <div class="w-full">
        <div class="text-center mb-8">
            <i data-lucide="download" class="w-16 h-16 text-indigo-400 mx-auto mb-4"></i>
            <h1 class="text-3xl font-bold text-white">YouTube Downloader</h1>
        </div>

        <form method="post" class="mb-6">
            {% csrf_token %}
            <input type="hidden" name="action" value="search">

            <div class="flex gap-0">
                <div class="flex-1 relative">
                    {% for field in search_form %}
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-400 text-xs mt-1 absolute">{{ field.errors.0 }}</p>
                        {% endif %}
                    {% endfor %}
                </div>

                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-r-xl transition-all duration-300 flex items-center gap-2 shadow-lg shadow-indigo-600/30 flex-shrink-0 border-l border-white/10">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
