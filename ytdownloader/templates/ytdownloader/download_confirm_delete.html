{% extends 'ytdownloader/base.html' %}
{% block title %}Excluir Download{% endblock %}

{% block content %}
<div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8 max-w-lg mx-auto text-center">
    <div class="mb-6">
        <i data-lucide="alert-triangle" class="w-16 h-16 text-red-400 mx-auto"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-4">Excluir Download</h1>
    <p class="text-gray-300 mb-2">Tem certeza que deseja excluir o download?</p>
    <p class="text-white font-medium mb-6 truncate">{{ download.title }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex gap-4 justify-center">
            <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 px-6 rounded-xl transition-all duration-300 inline-flex items-center gap-2 shadow-lg shadow-red-600/30">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Sim, excluir
            </button>
            <a href="{% url 'history' request_tenant.slug %}" class="bg-white/20 hover:bg-white/30 text-white font-semibold py-2.5 px-6 rounded-xl transition-all duration-300 inline-flex items-center gap-2">
                <i data-lucide="x" class="w-4 h-4"></i>
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
